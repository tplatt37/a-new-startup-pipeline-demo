AWSTemplateFormatVersion: '2010-09-09'
Description: "A-New-Startup - Sets up the DynamoDB database, SNS Topic, SQS Queue, SSM parameters and some IAM things for a-new-startup"

Parameters:

  Prefix:
    Type: String
    Default: "a-new-startup"
    Description: "Used for the unique naming of resources and exports.  You probably should not change this."
    
Resources:

  StartupSignupsTable:
    Type: AWS::DynamoDB::Table
    Description: A simple key/value table to store the info for anyone interested in our startup.
    Properties:
      # No TableName specified, a dynamic name will be generated.
      BillingMode: 'PAY_PER_REQUEST'
      AttributeDefinitions:
        -
          AttributeName: email
          AttributeType: S
      KeySchema:
        - 
          AttributeName: email
          KeyType: HASH 
      
  NewSignupQueue: 
    Type: AWS::SQS::Queue
    Description: A Queue for the A-New-Startup application
      
  NewSignupTopic:
    Type: AWS::SNS::Topic
    Description: A Topic so we can publish messages to inform someone when a person signs up.
    Properties:
      Subscription:
      - Endpoint:
          Fn::GetAtt: [NewSignupQueue, Arn]
        Protocol: sqs

  AllowSNS2SQSPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      PolicyDocument:
        Id: PublicationPolicy
        Statement:
        - Action: ['sqs:SendMessage']
          Condition:
            ArnEquals:
              aws:SourceArn: {Ref: NewSignupTopic}
          Effect: Allow
          Principal: {AWS: '*'}
          Resource:
            Fn::GetAtt: [NewSignupQueue, Arn]
          Sid: Allow-SNS-SendMessage
        Version: '2008-10-17'
      Queues:
      - {Ref: NewSignupQueue}
  
  SSMParamAccount:
    Type: AWS::SSM::Parameter
    Description: Store the Account ID in an SSM parameter, the NodeJS code will access this as needed.
    Properties:
      Name: /a-new-startup/dev/aws-account
      Type: String
      Value: !Ref AWS::AccountId
      Tags:
        demo: a-new-startup

  SSMParamTable:
    Type: AWS::SSM::Parameter
    Description: The NodeJS code will retrieve the name of the table it is to be updating from this Parameter
    Properties:
      Name: /a-new-startup/dev/tablename
      Type: String
      Value: !Ref StartupSignupsTable
      Tags:
        demo: a-new-startup

  SSMParamTopic:
    Type: AWS::SSM::Parameter
    Description: The NodeJS code will retrieve the ARN of the SNS topic from this parameter.
    Properties:
      Name: /a-new-startup/dev/topicarn
      Type: String
      Value: !Ref NewSignupTopic
      Tags:
        demo: a-new-startup

  InstanceProfileRole:
    Type: AWS::IAM::Role
    Description: The Role to be used by the EC2 instance - includes application permissions and SSM
    Properties:
      # NOTE: No RoleName specified, because IAM names are cross-region. We need it to be uniquely named.
      Description: Role for EC2 Instance Profile for A-New-Startup
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        # Use this Managed Policy so we can use SSM
        - "arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"
        # Also will add the app permissions via the policy defined next
        - !Ref AppManagedPolicy

  AppManagedPolicy:
      Type: AWS::IAM::ManagedPolicy
      Description: Basic application level permissions needed for a-new-startup to run.
      Properties:
        # No PolicyName used, we want a unique name generated automatically
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - 'dynamodb:PutItem'
              Resource:
                - Fn::Join:
                    - ""
                    - - "arn:"
                      - Ref: AWS::Partition
                      - ":dynamodb:"
                      - Ref: AWS::Region
                      - ":"
                      - Ref: AWS::AccountId
                      # Note how we use wildcards.  The backend resource names must start with a-new-startup
                      - :table/a-new-startup*
            - Effect: Allow
              Action:
                - 'ssm:GetParameter*'
              Resource:
                - Fn::Join:
                    - ""
                    - - "arn:"
                      - Ref: AWS::Partition
                      - ":ssm:"
                      - Ref: AWS::Region
                      - ":"
                      - Ref: AWS::AccountId
                      - :parameter/a-new-startup*
            - Effect: Allow
              Action:
                - 'sns:Publish'
              Resource:
                - Fn::Join:
                    - ""
                    - - "arn:"
                      - Ref: AWS::Partition
                      - ":sns:"
                      - Ref: AWS::Region
                      - ":"
                      - Ref: AWS::AccountId
                      - :a-new-startup*
            # If using X-Ray, the Daemon will need these permissions to upload data to cloud.
            - Effect: Allow
              Action: 
                - "xray:PutTraceSegments"
                - "xray:PutTelemetryRecords"
                - "xray:GetSamplingRules"
                - "xray:GetSamplingTargets"
                - "xray:GetSamplingStatisticSummaries"
              Resource: "*"
            # The ec2 instance will need to be able to download the bundle (CodeDeploy)
            # This requires the build to be in a bucket that starts with a-new-startup*
            - Effect: Allow
              Action:
                - 's3:Get*'
                - 's3:List*'
              Resource:
                - Fn::Join:
                    - ""
                    - - "arn:"
                      - Ref: AWS::Partition
                      - ":s3"
                      - ":"
                      - ":"
                      - ":a-new-startup*"
                - Fn::Join:
                    - ""
                    - - "arn:"
                      - Ref: AWS::Partition
                      - ":s3"
                      - ":"
                      - ":"
                      - ":a-new-startup*/*"

Outputs:

  InstanceProfileRoleName:
    Value: !Ref InstanceProfileRole
    Export:
      Name: !Join ['-', [!Ref Prefix, 'pipeline-InstanceProfileRoleName']]
      
  AppManagedPolicy:
    Value: !Ref AppManagedPolicy
    Export:
      Name: !Join ['-', [!Ref Prefix, 'pipeline-AppManagedPolicy']]
      
  TableName:
    Value: !Ref StartupSignupsTable
    Export:
      Name: !Join ['-', [!Ref Prefix, 'TableName']]
      
  TopicArn:
    Value: !Ref NewSignupTopic
    Export:
      Name: !Join ['-', [!Ref Prefix, 'TopicArn']]

  QueueArn:
    Value: !GetAtt NewSignupQueue.Arn
    Export:
      Name: !Join ['-', [!Ref Prefix, 'QueueArn']]
