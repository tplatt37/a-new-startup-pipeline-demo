AWSTemplateFormatVersion: '2010-09-09'
Description: A-New-Startup - EC2 - Full Pipeline including backend resources

Parameters:
  Prefix:
    Type: String
    Default: a-new-startup
    Description: "Used for resource naming. You probably shouldn't change this."

Resources:

  # This is the FULL PIPELINE - Code Commit -> Build (App/Test)  -> Deploy Backend (DDB/SNS/SQS) -> Deploy EC2 -> UI Test
  AppPipeline:
    Type: 'AWS::CodePipeline::Pipeline'
    Properties:
      # Don't change this name.  Needs to have the same name as the other pipeline.
      Name: a-new-startup
      Tags:
        - Key: demo
          Value: a-new-startup
      ArtifactStore:
          Type: S3
          Location: !ImportValue a-new-startup-ArtifactStoreBucket
      RoleArn: !ImportValue a-new-startup-CodePipelineServiceRole
      Stages:
        - Name: Source
          Actions:
            - Name: Application-Code
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: CodeCommit
              OutputArtifacts:
                - Name: SourceOutput
              Configuration:
                BranchName: "main"
                RepositoryName: "a-new-startup"
                PollForSourceChanges: false
              RunOrder: 1
            - Name: Testing-Code
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: CodeCommit
              OutputArtifacts:
                - Name: TestingSourceOutput
              Configuration:
                BranchName: "main"
                RepositoryName: "a-new-startup-testing-image"
                PollForSourceChanges: false
              RunOrder: 1
        - Name: Build
          Actions:
            - Name: Build-App-for-EC2
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildArtifact
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !ImportValue a-new-startup-BuildProject
              RunOrder: 1
            - Name: Build-Testing-Container
              InputArtifacts:
                - Name: TestingSourceOutput
              OutputArtifacts:
                - Name: ContainerImageArtifact
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !ImportValue a-new-startup-TestImageBuildProject
              RunOrder: 1

        - Name: Deploy-Backend
          Actions:
            - Name: Deploy-Backend
              InputArtifacts:
                # need to pass backend.yaml through from the source to the deploy stage.
                - Name: SourceOutput
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND
                RoleArn: !ImportValue 
                  Fn::Join: [ '-', [!Ref Prefix, "CFNDeployRole"]]
                # We're updating an existing stack.
                StackName: !Join [ "-", [ !Ref Prefix, "backend"]]
                # THIS IS COMING FROM THE APP SOURCE CODE
                # This is the template that creates the dynamically named DDB table, SNS Topic, and SQS queue.
                TemplatePath: "SourceOutput::template.yaml"
                # We're changing a parameter of the template - to ensure unique resource names.
                # See here: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/continuous-delivery-codepipeline-action-reference.html
                ParameterOverrides: '{"Prefix":"a-new-startup","Environment":"dev"}'
  
        - Name: Deploy
          Actions:
            - Name: Deploy-App-Code-to-EC2
              InputArtifacts:
                - Name: BuildArtifact
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeploy
                Version: 1
              Configuration:
                ApplicationName: !ImportValue a-new-startup-Application
                DeploymentGroupName: !ImportValue a-new-startup-DeploymentGroup
              RunOrder: 1
   
        - Name: Testing
          Actions:
            - Name: Run-Tests
              InputArtifacts:
                - Name: TestingSourceOutput
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !ImportValue a-new-startup-RunTestsBuildProject
              RunOrder: 1
