AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  a-new-startup : Sets up the CI/CD Pipeline (with tests)

Resources:
  # This is a more complicated (and slower) pipeline that includes UI testing after deployment.
  # We use a containerized test script and headless chrome browser to test the deployment via the web UI.
  AppPipeline:
    Type: 'AWS::CodePipeline::Pipeline'
    Properties:
      # Don't change this name.  Needs to have the same name as the other pipeline.
      Name: a-new-startup
      Tags:
        - Key: demo
          Value: a-new-startup
      ArtifactStore:
          Type: S3
          Location: !ImportValue a-new-startup-ArtifactStoreBucket
      RoleArn: !ImportValue a-new-startup-CodePipelineServiceRole
      Stages:
        - Name: Source
          Actions:
            - Name: Application-Code
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: CodeCommit
              OutputArtifacts:
                - Name: SourceOutput
              Configuration:
                BranchName: "main"
                RepositoryName: "a-new-startup"
                PollForSourceChanges: false
              RunOrder: 1
            - Name: Testing-Code
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: CodeCommit
              OutputArtifacts:
                - Name: TestingSourceOutput
              Configuration:
                BranchName: "main"
                RepositoryName: "a-new-startup-testing-image"
                PollForSourceChanges: false
              RunOrder: 1
        - Name: Build
          Actions:
            - Name: Build-App-for-EC2
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildArtifact
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !ImportValue a-new-startup-BuildProject
              RunOrder: 1
            - Name: Build-Testing-Container
              InputArtifacts:
                - Name: TestingSourceOutput
              OutputArtifacts:
                - Name: ContainerImageArtifact
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !ImportValue a-new-startup-TestImageBuildProject
              RunOrder: 1
  
        - Name: Deploy
          Actions:
            - Name: Deploy-App-Code-to-EC2
              InputArtifacts:
                - Name: BuildArtifact
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeploy
                Version: 1
              Configuration:
                ApplicationName: !ImportValue a-new-startup-Application
                DeploymentGroupName: !ImportValue a-new-startup-DeploymentGroup
              RunOrder: 1
   
        - Name: Testing
          Actions:
            - Name: Run-Tests
              InputArtifacts:
                - Name: TestingSourceOutput
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !ImportValue a-new-startup-RunTestsBuildProject
              RunOrder: 1
