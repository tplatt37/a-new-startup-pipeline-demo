AWSTemplateFormatVersion: '2010-09-09'
Description: A-New-Startup - Sets up the CI/CD Pipeline

Resources:
  
#  ___  __  ____  ____  ____  __  ____  ____  __    __  __ _  ____ 
# / __)/  \(    \(  __)(  _ \(  )(  _ \(  __)(  )  (  )(  ( \(  __)
#( (__(  O )) D ( ) _)  ) __/ )(  ) __/ ) _) / (_/\ )( /    / ) _) 
# \___)\__/(____/(____)(__)  (__)(__)  (____)\____/(__)\_)__)(____) 
# 
#

  # This is the simple pipeline.  Source -> Build -> Deploy
  AppPipeline:
    Type: 'AWS::CodePipeline::Pipeline'
    Properties:
      Name: a-new-startup 
      Tags:
        - Key: demo
          Value: a-new-startup
      ArtifactStore:
          Type: S3
          Location: !ImportValue a-new-startup-ArtifactStoreBucket
      RoleArn: !ImportValue a-new-startup-CodePipelineServiceRole
      Stages:
        - Name: Source
          Actions:
            - Name: Application-Code
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: CodeCommit
              OutputArtifacts:
                - Name: SourceOutput
              Configuration:
                BranchName: "main"
                RepositoryName: "a-new-startup"
                PollForSourceChanges: false
              RunOrder: 1
        - Name: Build
          Actions:
            - Name: Build-App-for-EC2
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildArtifact
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !ImportValue a-new-startup-BuildProject
              RunOrder: 1

        - Name: Deploy
          Actions:
            - Name: Deploy-App-Code-to-EC2
              InputArtifacts:
                - Name: BuildArtifact
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeploy
                Version: 1
              Configuration:
                ApplicationName: !ImportValue a-new-startup-Application
                DeploymentGroupName: !ImportValue a-new-startup-DeploymentGroup
              RunOrder: 1
  
